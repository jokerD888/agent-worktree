name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version: "1.26.x" }
      - name: Build AWT Self-Contained Skill and Binaries
        shell: bash
        run: |
          mkdir -p dist/agent-worktree/bin/windows-amd64
          mkdir -p dist/agent-worktree/bin/windows-arm64
          mkdir -p dist/agent-worktree/bin/linux-amd64
          mkdir -p dist/agent-worktree/bin/linux-arm64
          mkdir -p dist/agent-worktree/bin/darwin-amd64
          mkdir -p dist/agent-worktree/bin/darwin-arm64

          # Cross-compile CLI binaries for all supported platforms
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/agent-worktree/bin/windows-amd64/awt.exe ./cmd/awt
          GOOS=windows GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/agent-worktree/bin/windows-arm64/awt.exe ./cmd/awt
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/agent-worktree/bin/linux-amd64/awt ./cmd/awt
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/agent-worktree/bin/linux-arm64/awt ./cmd/awt
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/agent-worktree/bin/darwin-amd64/awt ./cmd/awt
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/agent-worktree/bin/darwin-arm64/awt ./cmd/awt

          # Copy skill definitions, scripts, and references
          cp skills/agent-worktree/SKILL.md dist/agent-worktree/SKILL.md
          cp -R skills/agent-worktree/scripts dist/agent-worktree/scripts
          cp -R skills/agent-worktree/references dist/agent-worktree/references
          chmod +x dist/agent-worktree/scripts/*.sh

          # Bundle installer scripts directly into release package for self-contained installation
          mkdir -p dist/agent-worktree/install
          cp installers/install-skill.ps1 dist/agent-worktree/install/install.ps1
          cp installers/install-skill.sh dist/agent-worktree/install/install.sh
          chmod +x dist/agent-worktree/install/install.sh

          find dist/agent-worktree/bin -type f -exec chmod +x {} +

          # Package self-contained skill archives
          (cd dist && tar -czf agent-worktree.tar.gz agent-worktree)
          (cd dist && zip -r agent-worktree.zip agent-worktree)
          rm -rf dist/agent-worktree

          # Build standalone MCP binaries (Optional Adapter)
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/awt-mcp_windows_amd64.exe ./cmd/awt-mcp
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/awt-mcp_linux_amd64 ./cmd/awt-mcp
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/awt-mcp_linux_arm64 ./cmd/awt-mcp
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/awt-mcp_darwin_amd64 ./cmd/awt-mcp
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/awt-mcp_darwin_arm64 ./cmd/awt-mcp

      - name: Create checksums
        working-directory: dist
        run: sha256sum * > checksums.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/agent-worktree.tar.gz
            dist/agent-worktree.zip
            dist/awt-mcp_*
            dist/checksums.txt
